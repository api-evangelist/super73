name: SUPER73 Storefront GraphQL API
endpoint: https://super73.com/api/2025-07/graphql.json
status: live
authentication: none-required-for-read
ownership: >-
  This is Shopify's platform-standard Storefront GraphQL schema served per-store from SUPER73's own host
  — the templated-platform case (comparable to {site}/wp-json/...). SUPER73 did not author the schema,
  but the endpoint is on its domain and returns its data: an anonymous {shop{name primaryDomain{url}}}
  query returns name "SUPER73" and primaryDomain "https://super73.com". Recorded as a SUPER73 interface,
  NOT as a SUPER73-authored contract; no SDL is saved into this repo for that reason.
introspection:
  available: true
  authenticated: false
  probed: '2026-08-29'
  type_count: 422
  schema_version: '2025-07'
  schema_docs: https://shopify.dev/docs/api/storefront
  note: >-
    Full introspection answers anonymously. Read queries against catalog, collection, page, blog and shop
    data succeed with no X-Shopify-Storefront-Access-Token. The response carries an extensions.cost block
    (requestedQueryCost) — Shopify's calculated query-cost rate-limit signal.
