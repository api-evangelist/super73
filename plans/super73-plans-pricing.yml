note: >-
  SUPER73 publishes no API plans, tiers, quotas or developer pricing of any kind. There is no developer
  program to price: the agent surface is an unmetered, unauthenticated affordance attached to a
  direct-to-consumer e-commerce storefront, and access to it is free because its purpose is to sell
  bikes. What SUPER73 does price is products — e-bikes, accessories, apparel and replacement parts,
  listed per-SKU on the storefront and returned by the catalog tools in ISO 4217 minor units. That is
  merchandise pricing, not API plan pricing, and it is deliberately NOT recorded here as plans.
