generated: '2026-08-29'
method: probed
source: >-
  Live probes of https://super73.com/.well-known/ucp, /.well-known/openid-configuration,
  /.well-known/oauth-protected-resource, /api/ucp/mcp and /api/2025-07/graphql.json, 2026-08-29
summary: >-
  SUPER73 conforms to a notably modern agent stack for a consumer hardware brand — MCP, UCP, OIDC and
  RFC 9728 are all live and anonymously verifiable — while publishing none of the classic API-provider
  standards (no OpenAPI, no AsyncAPI, no RFC 9457 problem details, no RFC 9116 security.txt).
standards:
- id: mcp
  name: Model Context Protocol
  conforms: true
  evidence: >-
    POST https://super73.com/api/ucp/mcp with {"jsonrpc":"2.0","id":1,"method":"tools/list"} returned
    HTTP 200 and a valid JSON-RPC 2.0 result containing 13 tools, each with a JSON Schema
    2020-12 inputSchema.
  method: probed
- id: ucp
  name: Universal Commerce Protocol
  version: '2026-08-25'
  conforms: true
  domain_standard: true
  evidence: >-
    https://super73.com/.well-known/ucp returns a UCP merchant profile declaring version 2026-08-25 plus
    two prior versions, the dev.ucp.shopping service over MCP transport, eight capabilities
    (cart, checkout, fulfillment, discount, order, catalog.search, catalog.lookup, dev.shopify.catalog)
    and three payment handlers (com.google.pay, dev.shopify.card, dev.shopify.shop_pay).
  method: probed
  note: >-
    This is the domain standard for SUPER73's market position — agentic retail commerce. A buyer's agent
    that already speaks UCP transacts with this store with no bespoke connector.
- id: jsonrpc-2.0
  name: JSON-RPC 2.0
  conforms: true
  evidence: The MCP endpoint accepts and returns well-formed JSON-RPC 2.0 envelopes.
  method: probed
- id: json-schema-2020-12
  name: JSON Schema draft 2020-12
  conforms: true
  evidence: Every tool inputSchema declares $schema https://json-schema.org/draft/2020-12/schema.
  method: probed
- id: oidc
  name: OpenID Connect Discovery 1.0
  conforms: true
  evidence: >-
    https://super73.com/.well-known/openid-configuration returns a valid discovery document with issuer,
