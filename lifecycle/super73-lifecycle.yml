summary: >-
  SUPER73 operates no API lifecycle program of its own. Both agent surfaces inherit their versioning and
  deprecation cadence wholesale from the platforms underneath them — UCP dated protocol versions and
  Shopify dated API versions — and SUPER73 publishes no changelog, no deprecation policy, no SLA and no
  status page for either.
