aid: super73
name: Super73
description: >-
  SUPER73 (legally SUPER73, Inc., founded 2016 in Orange County, California as Lithium Cycles) is an
  American electric-bicycle and lifestyle adventure brand best known for its moped-styled Class 2 e-bikes
  — the S-Series, ZX, RX, R-Series Adventure and the 2026 A-Series with modular dual-battery technology.
  The company sells direct-to-consumer through Shopify storefronts in North America (super73.com) and
  Europe (eu.super73.com, operated by SUPER73 BV), and pairs its bikes with a mobile app that adds
  Bluetooth ride telemetry plus a cellular IoT upgrade for GPS tracking, movement alerts, digital bike
  passport and remote immobilizer. SUPER73 publishes no traditional developer program, but both
  storefronts expose a real, anonymous, machine-callable agent surface: an /llms.txt and /agents.md agent
  instruction document, a Universal Commerce Protocol (UCP 2026-08-25) merchant profile at
  /.well-known/ucp, a live MCP endpoint at /api/ucp/mcp serving 13 commerce tools with full JSON Schema,
  and an anonymously introspectable Shopify Storefront GraphQL API.
