apis:
- aid: super73-agent-commerce
  name: SUPER73 Agent Commerce (UCP/MCP)
  description: >-
    The agent-facing commerce API for the SUPER73 North American storefront. Implements the Universal
    Commerce Protocol (UCP) 2026-08-25 over MCP: a merchant profile at /.well-known/ucp declares the
    supported versions, capabilities (cart, checkout, fulfillment, discount, order, catalog search and
    lookup) and payment handlers, and the MCP endpoint at /api/ucp/mcp answers tools/list anonymously
    with 13 tools and complete JSON Schema inputs. Checkout completion requires contemporaneous human
    buyer approval.
  humanURL: https://super73.com/agents.md
  baseURL: https://super73.com/api/ucp/mcp
