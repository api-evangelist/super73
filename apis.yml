- aid: super73-storefront-graphql
  name: SUPER73 Storefront GraphQL API
  description: >-
    The Shopify Storefront GraphQL API served on SUPER73's own host. Anonymous introspection and
    anonymous read queries against SUPER73 catalog, collection, page, blog and shop data succeed with no
    access token; cart and customer mutations are also exposed. The schema is Shopify's platform-standard
    versioned Storefront schema (422 types at version 2025-07), served per-store — the templated-platform
    case, not a SUPER73-authored contract.
  humanURL: https://shopify.dev/docs/api/storefront
  baseURL: https://super73.com/api/2025-07/graphql.json
  tags:
  - GraphQL
  - E-Commerce
  - Shopify
  properties:
  - type: GraphQL
    url: graphql/super73-storefront-graphql.yml
- aid: super73-eu-agent-commerce
  name: SUPER73 BV Agent Commerce (UCP/MCP)
  description: >-
    The agent-facing commerce API for the European SUPER73 storefront, operated by SUPER73 BV on the
    super73europe Shopify store. Identical UCP 2026-08-25 / MCP surface to the North American store —
    the same 13 tools — served from the eu.super73.com host with its own merchant profile, OAuth
    authorization server and buyer identity.
  humanURL: https://eu.super73.com/llms.txt
  baseURL: https://eu.super73.com/api/ucp/mcp
