summary: >-
  SUPER73 states that the agent commerce endpoint is rate limited but publishes no number, no window and
  no headers. A live 200 response carries no RateLimit-*, X-RateLimit-* or Retry-After header, so an
  agent has no runtime budget signal on the MCP surface and must discover the ceiling by being 429'd.
  The GraphQL surface is the exception: it returns a calculated query cost in the response body.
